<!-- loading screen: painted before the 6MB of game arrives, gone once it's all in -->
<style>
@font-face{font-family:C4Boot;src:url(data:font/woff2;base64,/*BOOTFONT*/) format("woff2");font-display:block}
#boot{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
  background:radial-gradient(ellipse at 50% 36%,#2a0f3a 0%,#120618 50%,#050307 100%);color:#F5F1E8;font-family:system-ui,-apple-system,sans-serif;transition:opacity .55s ease}
#boot.gone{opacity:0;pointer-events:none}
#boot .bk-sky{position:absolute;inset:0;pointer-events:none}
#boot .bk-sky i{position:absolute;width:var(--s);height:var(--s);border-radius:50%;opacity:.22;filter:blur(.5px);
  background:radial-gradient(circle,#0000 38%,var(--c) 39% 52%,#0000 53%),repeating-conic-gradient(var(--c) 0 15deg,#fff 15deg 30deg);
  -webkit-mask:radial-gradient(circle,#000 62%,#0000 63%);mask:radial-gradient(circle,#000 62%,#0000 63%);animation:bootFall var(--d) linear infinite;animation-delay:var(--w)}
@keyframes bootFall{from{transform:translateY(-20vh) rotate(0)}to{transform:translateY(120vh) rotate(540deg)}}
#boot .bk-stage{position:relative;width:min(38vmin,170px);aspect-ratio:2/3;perspective:900px}
#boot .bk-glow{position:absolute;inset:-28%;border-radius:50%;background:radial-gradient(circle,rgba(255,62,165,.35),rgba(53,200,255,.12) 45%,transparent 68%);animation:bootPulse 2.2s ease-in-out infinite}
@keyframes bootPulse{50%{transform:scale(1.08);opacity:.75}}
#boot .bk-card{position:absolute;inset:0;transform-style:preserve-3d;animation:bootFlip 3.2s cubic-bezier(.7,0,.3,1) infinite}
@keyframes bootFlip{0%,30%{transform:rotateY(0) translateY(0)}45%{transform:rotateY(90deg) translateY(-10px)}50%,80%{transform:rotateY(180deg) translateY(0)}95%{transform:rotateY(270deg) translateY(-10px)}100%{transform:rotateY(360deg)}}
#boot .bk-face{position:absolute;inset:0;border-radius:9%;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 18px 40px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.08)}
#boot .bk-back{background:#0A0507;overflow:hidden}
#boot .bk-back img{width:100%;height:100%;object-fit:cover;display:block}
#boot .bk-front{transform:rotateY(180deg);background:linear-gradient(160deg,#fffdf6,#efe8d8);color:#121014;font-family:Georgia,serif}
#boot .bk-front b{position:absolute;left:9%;top:5%;font-size:min(9vmin,40px);line-height:1}
#boot .bk-front em{position:absolute;right:9%;bottom:5%;font-size:min(9vmin,40px);line-height:1;font-style:normal;transform:rotate(180deg)}
#boot .bk-front span{position:absolute;inset:0;display:grid;place-items:center;font-size:min(20vmin,90px)}
#boot .bk-bt{margin-top:min(6vmin,30px);font:400 min(12.5vmin,62px)/1 C4Boot,Impact,system-ui;letter-spacing:.02em;color:#FFD24D;
  -webkit-text-stroke:2px #3a0a2a;text-shadow:0 4px 0 #b0136a,0 0 22px rgba(255,62,165,.55),0 10px 22px rgba(0,0,0,.6);transform:rotate(-4deg);white-space:nowrap}
#boot .bk-bs{margin-top:10px;font:900 min(3.4vmin,14px) system-ui;letter-spacing:.55em;padding-left:.55em;color:#9FE6FF;text-shadow:0 0 10px rgba(53,200,255,.6)}
#boot .bk-bb{position:relative;margin-top:min(7vmin,34px);width:min(70vw,300px);height:12px;border-radius:999px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
#boot .bk-bb i{position:absolute;left:0;top:0;bottom:0;width:4%;border-radius:999px;background:linear-gradient(90deg,#ff3ea5,#FFD24D);box-shadow:0 0 14px rgba(255,62,165,.6);transition:width .4s ease}
#boot .bk-bb u{position:absolute;top:50%;left:4%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;transition:left .4s ease;
  background:radial-gradient(circle,#FFD24D 0 34%,#0000 35%),repeating-conic-gradient(#b0136a 0 22.5deg,#fff 22.5deg 45deg);box-shadow:0 0 0 2px #b0136a,0 0 12px rgba(255,210,77,.7);animation:bootSpin 1s linear infinite}
@keyframes bootSpin{to{transform:rotate(360deg)}}
#boot .bk-bp{margin-top:14px;font:800 12px system-ui;color:#bdb3c4;letter-spacing:.1em;min-height:1.2em;text-transform:uppercase}
#boot .bk-bf{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:20px;right:20px;text-align:center;font:600 12px/1.45 system-ui;color:#8b8193}
#boot .bk-bf b{color:#FFD24D;letter-spacing:.12em;font-size:10px;display:block;margin-bottom:3px}
@media (orientation:landscape) and (max-height:500px){#boot .bk-stage{width:22vh}#boot .bk-bt{font-size:11vh;margin-top:3vh}#boot .bk-bb{margin-top:3vh}}
</style>
<div id="boot" role="status" aria-label="Loading">
  <div class="bk-sky"></div>
  <div class="bk-stage"><div class="bk-glow"></div><div class="bk-card"><div class="bk-face bk-back"><img decoding="sync" alt="" src="data:image/webp;base64,/*BOOTBACK*/"></div><div class="bk-face bk-front"><b>A</b><span>&#9824;</span><em>A</em></div></div></div>
  <div class="bk-bt">4 THE BOYS</div>
  <div class="bk-bs">CASINO GAMES</div>
  <div class="bk-bb"><i id="bootBar"></i><u id="bootChip"></u></div>
  <div class="bk-bp" id="bootTxt">Shuffling the shoe…</div>
  <div class="bk-bf"><b>TIP</b><span id="bootTip"></span></div>
</div>
<script>
(function () {
  var tips = [
    "Drag chips from one bet spot to another, or back to the rack to take them down.",
    "SAVE SEAT keeps your chips on the table when you step away.",
    "Blackjack: always split aces and eights.",
    "High or Low: the same rank is a miss — but a TIE bet pays the odds.",
    "Plinko 4TB: land in gold twice and the multipliers stack.",
    "Destroyer: a ship only pays once it has two hits.",
    "Points week: every game has its own wallet. Get one past $15,000 to score.",
    "Pick your card back in Settings.",
    "Pai Gow: the dealer's cards are face up — use them.",
    "Craps plays best with your phone turned sideways."
  ];
  var t = document.getElementById("bootTip"); if (t) t.textContent = tips[Math.floor(Math.random() * tips.length)];
  var sky = document.querySelector("#boot .bk-sky"), cols = ["#FFD24D", "#ff3ea5", "#35C8FF", "#57E06A", "#a855f7"];
  for (var i = 0; i < 14; i++) {
    var c = document.createElement("i"), s = 26 + Math.random() * 40;
    c.style.cssText = "left:" + (Math.random() * 100) + "%;top:-12%;--s:" + s + "px;--c:" + cols[i % cols.length] + ";--d:" + (6 + Math.random() * 7) + "s;--w:-" + (Math.random() * 12) + "s";
    sky.appendChild(c);
  }
  var lines = ["Shuffling the shoe", "Racking the chips", "Waking up the dealers", "Spraying the walls", "Polishing the felt", "Loading the dice"];
  var p = 0.04, t0 = Date.now(), over = false;
  function set(x) {
    p = Math.max(p, Math.min(1, x));
    var w = Math.round(p * 100) + "%", b = document.getElementById("bootBar"), u = document.getElementById("bootChip"), tx = document.getElementById("bootTxt");
    if (b) b.style.width = w; if (u) u.style.left = w;
    if (tx) tx.textContent = p >= 1 ? "Let's gamble!" : lines[Math.min(lines.length - 1, Math.floor(p * lines.length))] + "… " + Math.round(p * 100) + "%";
  }
  // the page comes down in one piece: creep toward 90% while it does, then finish when it's all in
  var tick = setInterval(function () { if (!over) set(p + (0.9 - p) * 0.06); }, 120);
  function done() {
    if (over) return; over = true; clearInterval(tick); set(1);
    var e = document.getElementById("boot"), wait = Math.max(0, 1400 - (Date.now() - t0));   // long enough to see the flip
    setTimeout(function () { e.classList.add("gone"); setTimeout(function () { if (e.parentNode) e.parentNode.removeChild(e); }, 650); }, wait + 300);
  }
  document.addEventListener("DOMContentLoaded", function () { set(0.95); });
  window.addEventListener("load", done);
  setTimeout(done, 20000);   // never stuck on the loader
  window.__boot = { set: set, done: done };
})();
</script>
