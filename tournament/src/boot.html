<!-- loading screen: the red 4 The Boys logo on black, turning like a wheel, picking up right where the phone's own startup screen leaves off -->
<style>
#boot{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:#000;transition:opacity .45s ease}
#boot.gone{opacity:0;pointer-events:none}
#boot img{width:min(46vmin,200px);height:auto;animation:bootTurn 1.6s linear infinite;filter:drop-shadow(0 0 18px rgba(200,16,46,.35))}
@keyframes bootTurn{to{transform:rotate(360deg)}}
</style>
<div id="boot" role="status" aria-label="Loading"><img alt="" decoding="sync" src="data:image/webp;base64,/*BOOTLOGO*/"></div>
<script>
(function () {
  var t0 = Date.now(), over = false;
  function done() {
    if (over) return; over = true;
    var e = document.getElementById("boot"), wait = Math.max(0, 900 - (Date.now() - t0));
    setTimeout(function () { e.classList.add("gone"); setTimeout(function () { if (e.parentNode) e.parentNode.removeChild(e); }, 500); }, wait);
  }
  window.addEventListener("load", done);
  setTimeout(done, 20000);   // never stuck on the loader
})();
</script>
