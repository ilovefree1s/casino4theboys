<style>
#boot{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;transition:opacity .45s ease}
#boot.gone{opacity:0;pointer-events:none}
#boot img{width:min(46vmin,200px);height:auto;animation:bootTurn 5s linear infinite;filter:drop-shadow(0 0 18px rgba(200,16,46,.35))}
@keyframes bootTurn{to{transform:rotate(360deg)}}
#boot .bk-bb{position:relative;margin-top:min(8vmin,38px);width:min(70vw,300px);height:12px;border-radius:999px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
#boot .bk-bb i{position:absolute;left:0;top:0;bottom:0;width:4%;border-radius:999px;background:linear-gradient(90deg,#ff3ea5,#FFD24D);box-shadow:0 0 14px rgba(255,62,165,.6);transition:width .4s ease}
#boot .bk-bb u{position:absolute;top:50%;left:4%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;transition:left .4s ease;
  background:radial-gradient(circle,#FFD24D 0 34%,#0000 35%),repeating-conic-gradient(#b0136a 0 22.5deg,#fff 22.5deg 45deg);box-shadow:0 0 0 2px #b0136a,0 0 12px rgba(255,210,77,.7);animation:bootTurn 1s linear infinite}
#boot .bk-bp{margin-top:14px;font:800 12px system-ui,sans-serif;color:#bdb3c4;letter-spacing:.1em;min-height:1.2em;text-transform:uppercase}
@media (orientation:landscape) and (max-height:500px){#boot img{width:34vh}#boot .bk-bb{margin-top:5vh}}
</style>
<div id="boot" role="status" aria-label="Loading">
  <img alt="" decoding="sync" src="data:image/webp;base64,/*BOOTLOGO*/">
  <div class="bk-bb"><i id="bootBar"></i><u id="bootChip"></u></div>
  <div class="bk-bp" id="bootTxt">Shuffling the shoe…</div>
</div>
<script>
(function () {
  var lines = ["Shuffling the shoe", "Racking the chips", "Waking up the dealers", "Spraying the walls", "Polishing the felt", "Loading the dice"];
  var p = 0.04, t0 = Date.now(), over = false;
  function set(x) {
    p = Math.max(p, Math.min(1, x));
    var w = Math.round(p * 100) + "%", b = document.getElementById("bootBar"), u = document.getElementById("bootChip"), tx = document.getElementById("bootTxt");
    if (b) b.style.width = w; if (u) u.style.left = w;
    if (tx) tx.textContent = p >= 1 ? "Let's gamble!" : lines[Math.min(lines.length - 1, Math.floor(p * lines.length))] + "… " + Math.round(p * 100) + "%";
  }
  // the page comes down in one piece: creep toward 90% while it does, then finish when it's all in
  var tick = setInterval(function () { if (!over) set(p + (0.9 - p) * 0.06); }, 120);
  function done() {
    if (over) return; over = true; clearInterval(tick); set(1);
    var e = document.getElementById("boot"), wait = Math.max(0, 900 - (Date.now() - t0));
    setTimeout(function () { e.classList.add("gone"); setTimeout(function () { if (e.parentNode) e.parentNode.removeChild(e); }, 500); }, wait + 300);
  }
  document.addEventListener("DOMContentLoaded", function () { set(0.95); });
  window.addEventListener("load", done);
  setTimeout(done, 20000);
  window.__boot = { set: set, done: done };
})();
</script>
