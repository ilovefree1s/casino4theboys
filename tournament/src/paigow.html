<!-- ================= PAI GOW POKER ================= -->
<div class="screen" id="screen-paigow">
  <img class="pg-bg" id="pg-bg" alt="">
  <div class="uth-table dj-table pg-table">
    <div class="dj-top">
      <div class="uth-topbar">
        <button class="wayout" id="pg-back" aria-label="Back to poker"><i>&#8249;</i><b>POKER</b></button>
        <div class="uth-money purse">
          <span class="lbl">BANKROLL</span><span class="val" id="pg-bankroll">5,000</span>
          <span class="gap"></span>
          <span class="lbl">AT RISK</span><span class="val risk" id="pg-risk">0</span>
        </div>
      </div>
      <div class="pg-sign">FACE UP PAI GOW <span>WIN BOTH HANDS TO WIN · DEALER ACE-HIGH PUSHES</span></div>
      <div class="uth-label" id="pg-dealer-label"><span class="nm">DEALER</span></div>
      <div class="pg-row" id="pg-dealer"></div>
      <div class="pg-caps" id="pg-dealer-caps"></div>
      <div class="uth-rule pg-rule"></div>
      <div class="uth-label gold" id="pg-you-label"><span class="nm">YOUR HAND</span></div>
      <div class="pg-row you" id="pg-you"></div>
      <div class="pg-caps" id="pg-you-caps"></div>
      <div class="uth-message" id="pg-message">Place your bet</div>
      <div class="pg-bonusline" id="pg-bonusline"></div>
    </div>
    <div class="dj-bottom">
      <div class="pg-felt">
        <div class="pg-col l">
          <div id="pg-spot-ace"></div>
          <div class="pg-pays" id="pg-acepays">
            <div class="hd">ACE-HIGH PAYS</div>
            <div class="rows" id="pg-ace-rows"></div>
            <div class="ft">DEALER IS ACE-HIGH</div>
          </div>
        </div>
        <div class="pg-col c">
          <div id="pg-spot-bonus"></div>
          <div id="pg-spot-bet"></div>
        </div>
        <div class="pg-col r">
          <div class="pg-pays" id="pg-pays">
            <div class="hd">BONUS PAYS</div>
            <div class="rows" id="pg-pays-rows"></div>
            <div class="ft">BEST HAND IN YOUR SEVEN</div>
          </div>
        </div>
      </div>
      <div id="pg-rack"></div>
      <div class="uth-actions" id="pg-actions"></div>
    </div>
  </div>
  <!-- Free play only: the campaign gets the shell's GAME OVER instead. -->
  <div class="uth-rebuy" id="pg-rebuy">
    <div class="ttl">OUT OF CHIPS</div>
    <button class="buy" id="pg-buyin">BUY BACK IN</button>
  </div>
</div>
